<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milon M&J Shopping</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; color: #333; text-align: center; }
        header { background-color: #1a1a1a; color: white; padding: 15px; }
        .banner { width: 100%; height: 220px; object-fit: cover; display: block; }
        .welcome-text { padding: 25px 15px 10px; }
        .welcome-text h1 { color: #1a1a1a; margin-bottom: 8px; font-size: 24px; }
        .products { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 20px; }
        .product-card { background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 12px; width: 260px; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
        .product-card h3 { margin-top: 10px; font-size: 18px; color: #222; }
        .btn { background: #1a1a1a; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        footer { background-color: #1a1a1a; color: white; padding: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <h2>Milon M&J Shopping</h2>
    </header>

    <img class="banner" src="https://i.postimg.cc/yN8f77w4/1787696388029.jpg" alt="Banner">

    <div class="welcome-text">
        <h1>Welcome to Milon M&J Shopping</h1>
        <p>আমাদের শপিং সেন্টারের ওয়েবসাইটে আপনাকে স্বাগতম!</p>
    </div>

    <div class="products">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=400" alt="Mens Collection">
            <h3>পুরুষদের কালেকশন</h3>
            <button class="btn">কালেকশন দেখুন</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=400" alt="Womens Collection">
            <h3>মহিলাদের কালেকশন</h3>
            <button class="btn">কালেকশন দেখুন</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1514090458221-65bb69cf63e6?w=400" alt="Kids Collection">
            <h3>বাচ্চাদের কালেকশন</h3>
            <button class="btn">কালেকশন দেখুন</button>
        </div>
    </div>
<!-- সোশ্যাল মিডিয়া লিংক সেকশন -->
<div style="text-align: center; margin: 30px 0; padding: 20px; background-color: #ffffff; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h3 style="color: #333; margin-bottom: 15px;">আমাদের সাথে যুক্ত থাকুন</h3>
    
    <!-- ফেসবুক লিংক -->
    <a href="https://facebook.com" target="_blank" style="display: inline-block; margin: 5px; padding: 10px 20px; background-color: #1877F2; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
        Facebook Page
    </a>

    <!-- হোয়াটসঅ্যাপ লিংক -->
    <a href="https://wa.me/8801700000000" target="_blank" style="display: inline-block; margin: 5px; padding: 10px 20px; background-color: #25D366; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
        WhatsApp Chat
    </a>
</div>

    <footer>
        <p>© 2026 Milon M&J Shopping | সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

</body>
</html>
